# sharpe-engine tuneable parameters. Nothing in source code hardcodes these.
# Starting values per ARCHITECTURE.md; TBD items are calibrated in backtest.

universe:
  min_price: 5.0
  min_adv_usd: 1_000_000
  require_edgar_fundamentals: true   # only trade US-GAAP (SEC EDGAR) filers (DECISIONS
                                     # D28): the yfinance ADR-fallback fundamentals are
                                     # junk (P/E ~0.01) and corrupted the value factor,
                                     # piling the book into foreign ADRs. EDGAR filers
                                     # also have liquid US options for the overlay.

portfolio:
  nav: 100_000
  min_position_usd: 4_000        # min funded position; the optimizer floor (w >= min or w = 0)
  max_single_name_pct: 0.05      # ~19-20 names (DECISIONS D24). The max-name cap — not
                                 # lambda/scale — governs name count; 5% over the 4% floor
                                 # gives a diversified, ~equal-weight book for capital
                                 # preservation. Was 0.10 (gave ~11 concentrated names).
  max_sector_pct: 0.30
  base_equity_allocation: 0.95   # 95% of the deployable base; 5% cash buffer (no regime filter)
  target_leverage: 2.0           # gross exposure = target_leverage × account equity (DECISIONS
                                 # D32). 2:1 on the paper book to lift covered-call coverage
                                 # (~10/19 names at $200k gross vs ~6 at 1x). The optimizer /
                                 # weights / caps are unchanged — they work in fractions of the
                                 # deployable base; leverage only scales that base. NOTE: leverage
                                 # scales the backtested drawdown ~linearly (equity maxDD −26% →
                                 # ~−50%); the backtest itself is 1x. Set 1.0 for unlevered.
  max_leverage: 2.0              # hard cap the pre-trade risk gate enforces; target must be ≤ this.
  infeasibility_max_retries: 3
  risk_aversion_lambda: 0.0      # alpha-driven weighting (DECISIONS D25): the composite
                                 # score already prices risk (low-vol is 25% of it), so a
                                 # mean-variance risk penalty double-counts the defensive
                                 # tilt and cost ~10%/yr in backtest. The box + sector +
                                 # min-position constraints provide diversification; the
                                 # FF5 covariance is kept for risk reporting, not weighting.

optimizer:
  preselect_top_k: 50            # rank by composite, optimize over this many names
  target_return_scale: 0.15      # mu = rank(composite)/N * scale; TBD — calibrate with
                                 # risk_aversion_lambda in Phase 2 to 20-30 held names (D20)

factors:
  weights:
    quality: 0.25
    value: 0.25
    low_beta: 0.25               # amendment 2026-07-02: was momentum (12-1); now a low-beta screen
    low_vol: 0.25
  beta_window: 252               # trailing days for β vs the market (12 months)
  beta_market: SPY               # market proxy for β (present in the equity price panel)
  vol_window: 252
  exclude_missing_fundamentals: false
  winsor_pct: 0.01               # winsorize each raw metric to its [1st, 99th] pct
                                 # before z-scoring — robust to fat tails, keeps the
                                 # four sub-scores at unit variance (true equal weight)
  report_lag_days: 0             # report_date now stores the real availability date:
                                 # EDGAR's actual SEC filing date (D22), and the
                                 # yfinance ADR fallback bakes in a +45d filing buffer.
                                 # So no extra lag is needed here.

rebalancing:
  primary: monthly               # first trading day of month — the ONE rebalance cadence
                                 # (DECISIONS D31): equities AND covered calls both rebalance
                                 # here and nowhere else. No drift-triggered out-of-cycle
                                 # rebalance; L1 drift is still computed each monitor pass as
                                 # telemetry (snapshots.drift) but never triggers a trade.
  incumbent_bonus: 0.0           # hysteresis (DECISIONS D26): composite-score (z) premium
                                 # for currently-held names, to cut membership churn /
                                 # turnover. 0 = off; calibrated by backtest sweep below.

covered_calls:
  # Overlay mode (2026-07-02): "index" = a portfolio-level SPY call overwrite sized to the book's
  # market beta (β_p × gross equity), harvesting SPY's liquid option premium — the low-beta book's
  # single-name options are too illiquid to write. "per_name" = classic per-holding covered calls.
  overlay_mode: index
  overwrite_coverage: 1.0        # fraction of the book's beta-exposure to overwrite with SPY calls
  target_delta: 0.30             # raised from 0.25 (DECISIONS D29): the delta sweep showed
                                 # 0.25 left premium on the table — 0.30 lifts the market-IV
                                 # Sharpe (1.18→1.31) with assignment a safe 22% (<30% cap).
  # Cadence (DECISIONS D31): calls are written at the monthly rebalance and closed +
  # rewritten at the next one — there is NO mid-cycle DTE roll. Matches the Phase 2b
  # backtest (one monthly write per option life); 30-45 DTE covers the ~1-month hold.
  min_dte_entry: 30
  max_dte_entry: 45
  reentry_threshold: 0.0         # re-enter if composite score > 0 after assignment
  # NOTE: single-name 10-share mini options were delisted ~2014 (D32), so a position must hold
  # >= 100 shares to be covered; there is no mini-contract path. (Removed the dead
  # prefer_mini_contracts / min_holding_days keys — neither was read by any module.)
  close_before_earnings: true    # close calls before an earnings announcement, rewrite after —
                                 # kept as a risk control (DECISIONS D31): the one event-driven
                                 # action outside the monthly cadence.

puts:                            # OPTIONAL cash-secured-put wheel overlay (backtest/sketch stage).
  enabled: false                 # master toggle. OFF by default — the live run_cycle put leg is
                                 # NOT wired yet (backtest sleeve only). Flip on once the numbers
                                 # justify it AND the live mechanics (risk gate + assignment) ship.
  target_delta: 0.30             # 30Δ OTM puts (mirrors the call side)
  budget_pct: 0.25               # share of the 2× gross budget given to the put sleeve. Puts
                                 # DISPLACE equity within max_leverage — never additive, so worst
                                 # case (all assigned) total long exposure still ≤ max_leverage.
  min_dte_entry: 30
  max_dte_entry: 45
  universe: ranked_held          # sell puts only on factor-ranked names (assignment = a wanted name)

execution:
  min_trade_usd: 500
  large_cap_adv_threshold: 50_000_000
  mid_cap_adv_threshold: 5_000_000
  spread_threshold: 0.001
  price_adjustment: all
  # Non-market orders cross the spread by up to this many bps so they actually FILL in-session,
  # instead of resting passively at the mid (which often never fills before the ~60s session-end
  # cancel — it left the establishing rebalance with a thin partial book). It is a CEILING: liquid
  # names still fill at the touch; only an abnormally wide spread (> this) rests for protection.
  marketable_limit_bps: 50
  # Execution redesign (docs/EXECUTION.md §5–§8): liquidity-tiered, patient-then-guaranteed.
  max_spread_bps: 150            # pathological-spread guard: above this quoted spread we do NOT
                                 # cross — post passive at a guarded reference and defer if needed
                                 # (the INBX lesson: its ~1400 bps ask was a phantom). bps of mid.
  ladder_steps: 3                # patient ladder: number of mid→touch steps for moderate/thin
                                 # names before reaching the marketable cap (deep+tight skip it).
  child_adv_pct: 0.10            # thin-name slicing: max child order = 10% of the name's ADV.
  # Re-price cadences (docs/EXECUTION.md §7). Fills now come from the live order feed (instant),
  # so these only govern how often a *resting* limit is re-anchored to the moving market.
  equity_repeg_s: 30             # stocks: re-anchor a resting limit to the live mid this often
  option_repeg_s: 150            # options: slower — option quotes crawl and requoting loses queue spot
  close_buffer_s: 300            # stop working this many seconds before 16:00; residual → auction/cross-day
  poll_interval_s: 2             # fallback fill-check interval — only used if the live feed is down
  # When the daily EOD/rebalance job fires (America/New_York). Mid-session: tight spreads and a long
  # runway before the 16:00 close for DAY orders to fill.
  rebalance_hour_et: 13
  rebalance_minute_et: 0
  # Backtest transaction-cost model (DECISIONS D23d): a half-spread charged in basis
  # points, tiered by ADV. Retires the `spread` high-low placeholder.
  cost_bps_large: 5              # ADV >= large_cap_adv_threshold
  cost_bps_mid: 10               # mid_cap_adv_threshold <= ADV < large
  cost_bps_small: 20             # ADV < mid_cap_adv_threshold

backtest:
  return_clip: 1.0               # clip a held name's monthly return to +/- this as a
                                 # data-glitch guard (held book is liquid; triggers rarely
                                 # and is logged). NOT a routine winsorization.
  benchmark: SPY                 # buy-and-hold comparison
  cc_premium_slippage: 0.05      # haircut on modeled option premium for execution/bid-ask
                                 # (Phase 2b covered-call backtest; option spreads not in data)

covariance:
  estimation_window_days: 60
  factor_source: ken_french      # FF5 daily, downloaded directly from the Ken French
                                 # data library (DECISIONS D23a) — pandas_datareader
                                 # import-crashes under pandas 3.0.
  min_regression_obs: 40         # a name needs >= this many aligned days in the window
                                 # or it is dropped from Sigma (history too thin)

ingest:
  # Free Alpaca IEX feed only has consolidated history from ~2020-07-27; full
  # 2016+ history needs the paid SIP feed (documented upgrade path). Decided
  # 2026-06-18 to proceed with the free ~6yr window for now.
  backfill_start: "2020-07-27"   # one-time historical pull start date
  adv_window: 20                 # trading days for average dollar volume
  lookback_days: 40              # calendar days pulled daily to compute adv_20d
  symbol_chunk_size: 200         # symbols per multi-symbol Alpaca bars request
  request_sleep_s: 0.2           # rate-limit pause between batched requests
  retry_backoff_s: [30, 60, 120] # exponential backoff on API failure

data_retention:
  raw_equities_days: 730         # 2-year rolling
  fundamentals: forever

alerts:
  smtp_host: smtp.gmail.com   # Gmail SMTP relay (STARTTLS on 587). M365 was abandoned for the
                             # test because the the firm tenant blocks basic SMTP AUTH (535 5.7.3)
                             # and needs IT to enable Authenticated SMTP. Personal Gmail is
                             # self-serve: generate a 16-char App Password (Google Account →
                             # Security → 2-Step Verification → App passwords) and put it in the
                             # SMTP_PASSWORD env var. A plain account password is also rejected by
                             # Gmail — the App Password is required (2FA must be on).
  smtp_port: 587
  email_to: diegogomezzx@gmail.com   # alert recipient (personal, for testing)
  email_from: diegogomezzx@gmail.com # sender (defaults to email_to); SMTP password from env SMTP_PASSWORD
  send_enabled: true         # LIVE 2026-06-23: a real test send authenticated against
                             # smtp.gmail.com with the 16-char Gmail App Password in
                             # SMTP_PASSWORD. Alerts now email (and still record to the alerts
                             # table + show on the dashboard). Set false to return to dry-run.
  staleness_threshold_pct: 0.10

dashboard:
  # Public dashboard (Tailscale Funnel + Caddy basic auth). URL + user are NOT secret and feed
  # the link in every alert email; the password is read from the DASHBOARD_PASSWORD env var
  # (never committed) and appended so you can click through and log in. Blank public_url omits
  # the footer.
  public_url: "https://sharpe-engine.tailc7136e.ts.net"
  public_user: "viewer"
  # Track-record + backtest benchmarks (defined in engine/benchmarks.py with descriptions).
  # SPY = S&P 500 beta; BXMD = CBOE S&P 500 30-delta BuyWrite (the direct analog of our 0.30Δ
  # covered calls, from CBOE's CDN); BXRD = CBOE Russell 2000 30-delta BuyWrite (small-cap
  # covered-call reference). Add a symbol here only after registering it in engine/benchmarks.py.
  live_benchmarks: [SPY, BXMD, BXRD]
